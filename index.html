
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chennai One Silver Pass</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#080e18;
 color:white;
 font-family:Arial,Helvetica,sans-serif;
 padding-bottom:85px;
}

.header{
 height:82px;padding:0 5%;
 display:flex;align-items:center;
 justify-content:space-between;
}
.header h1{font-size:23px;font-weight:700}
.actions{display:flex;gap:9px}
.actions button{
 border:0;border-radius:30px;
 padding:11px 15px;
 background:#111b2b;color:white;font-size:13px;
}

.bus-row{padding:5px 5% 18px}
.bus{
 display:inline-block;background:#f1f1f8;
 color:#192236;padding:11px 17px;
 border-radius:30px;font-size:13px;
}

.card-wrap{padding:0 4.5%}

.pass-card{
 width:100%;
 aspect-ratio:.685;
 min-height:430px;
 position:relative;
 overflow:hidden;
 border-radius:28px;
 border:3px solid #b18a43;
 color:#49351d;
 background:
   radial-gradient(ellipse at 82% 32%,rgba(255,255,255,.42),transparent 35%),
   radial-gradient(ellipse at 12% 80%,rgba(130,91,39,.18),transparent 40%),
   repeating-linear-gradient(130deg,
    rgba(255,255,255,.16) 0px,
    rgba(255,255,255,.16) 1px,
    transparent 1px,
    transparent 8px),
   linear-gradient(135deg,#c7a36a,#f2e2bd 43%,#d4b77f);
 box-shadow:0 5px 15px #0005;
}

/* Security-style background artwork */
.pass-card:before{
 content:"";
 position:absolute;
 inset:0;
 opacity:.8;
 pointer-events:none;
 background:
  radial-gradient(ellipse at 78% 29%,
   transparent 0 17%,rgba(126,91,46,.13) 17.2% 17.5%,
   transparent 17.8% 21%,rgba(255,255,255,.15) 21.2% 21.5%,
   transparent 21.8%),
  radial-gradient(ellipse at 18% 67%,
   transparent 0 14%,rgba(126,91,46,.12) 14.2% 14.5%,
   transparent 14.8%),
  repeating-radial-gradient(circle at 50% 48%,
   transparent 0 32px,
   rgba(126,91,46,.045) 33px 34px);
}

.security-lines{
 position:absolute;
 inset:0;
 pointer-events:none;
 opacity:.2;
 background:
  repeating-linear-gradient(0deg,
   transparent 0 42px,
   rgba(255,255,255,.3) 43px,
   transparent 44px),
  repeating-linear-gradient(90deg,
   transparent 0 55px,
   rgba(126,91,46,.1) 56px,
   transparent 57px);
}

.watermark{
 position:absolute;
 top:48%;left:50%;
 transform:translate(-50%,-50%) rotate(-34deg);
 color:rgba(92,59,23,.10);
 font-size:clamp(12px,3.5vw,17px);
 font-weight:900;letter-spacing:3px;
 white-space:nowrap;z-index:1;
}

.top-info{
 position:absolute;
 top:4%;left:5%;right:5%;
 display:flex;align-items:flex-start;
 gap:10px;z-index:3;
}

/* Ribbon-style MTC emblem */
.logo{
 width:53px;height:48px;
 flex-shrink:0;
 position:relative;
 display:flex;align-items:center;
 justify-content:center;
 color:#76552c;
 font-weight:900;font-size:12px;
}
.logo:before{
 content:"";
 position:absolute;
 left:0;right:0;top:12px;
 height:25px;
 background:#99733f;
 clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%,14% 50%);
 opacity:.9;
}
.logo:after{
 content:"";
 position:absolute;
 width:39px;height:39px;
 border:3px double #896333;
 border-radius:50%;
 background:rgba(232,211,169,.65);
}
.logo span{position:relative;z-index:2}

.heading{flex:1;min-width:0;padding-top:4px}

.pass-number{
 font-family:monospace;
 font-size:clamp(12px,3.5vw,17px);
 letter-spacing:1px;white-space:nowrap;
 color:#44321e;
}

.tamil{
 font-size:clamp(10px,3vw,14px);
 text-align:center;line-height:1.5;
 margin-top:5px;color:#62503a;
}

.demo-tag{
 position:absolute;right:0;top:0;
 font-size:9px;font-weight:900;
 color:#79552d;letter-spacing:1px;
}

.approval{
 position:absolute;
 width:23%;aspect-ratio:1;
 top:25%;right:5%;
 border-radius:50%;
 border:3px double rgba(134,99,55,.35);
 display:flex;align-items:center;
 justify-content:center;
 color:rgba(112,81,42,.55);
 z-index:2;transform:rotate(14deg);
 background:radial-gradient(circle,
  rgba(255,255,255,.12),transparent 70%);
}
.approval:before{
 content:"";
 position:absolute;
 inset:9%;border:1px solid rgba(134,99,55,.25);
 border-radius:50%;
}
.approval span{font-size:35px}
.approval small{
 position:absolute;bottom:8%;
 font-size:7px;letter-spacing:2px;
}

/* Central photo and pass details */
.portrait-panel{
 position:absolute;
 top:22%;left:50%;
 transform:translateX(-50%);
 width:43%;height:51%;
 border-radius:29px;
 background:#f8f8fb;
 border:2px solid #e2ded5;
 box-shadow:0 3px 10px #7a603322;
 display:flex;flex-direction:column;
 align-items:center;
 padding:8% 5% 5%;
 z-index:3;
}

.profile{
 width:100%;aspect-ratio:1;
 object-fit:cover;object-position:center;
 border-radius:21px;
 border:1px solid #ddd;
}

.amount{
 color:#202c43;
 font-size:clamp(25px,7vw,36px);
 font-weight:500;margin-top:12%;
 white-space:nowrap;
}
.valid-label{
 color:#8792a3;
 font-size:clamp(9px,2.8vw,13px);
 letter-spacing:3px;margin-top:13%;
}
.valid-date{
 color:#27344b;
 font-size:clamp(16px,4.8vw,23px);
 margin-top:8%;white-space:nowrap;
}

/* Bottom clock, activation artwork and QR */
.bottom-elements{
 position:absolute;
 left:3.5%;right:3.5%;
 bottom:6%;height:15%;
 display:flex;align-items:center;
 justify-content:space-between;
 gap:5px;z-index:3;
}

.clock-box{
 background:#f1f0f8;color:#26334b;
 border-radius:12px;width:27%;
 padding:10px 3px;text-align:center;
 box-shadow:0 2px 5px #735e4033;
}
.clock-date{
 font-family:monospace;
 font-size:clamp(9px,2.8vw,13px);
}
.clock-time{
 font-family:monospace;
 font-size:clamp(10px,3vw,15px);
 margin-top:5px;
}

.activated{
 background:#0877df;color:white;
 width:46%;min-height:75px;
 padding:8px 4px;
 border:4px solid #f8f5e9;
 border-radius:18px;
 transform:rotate(-5deg);
 box-shadow:0 3px 6px #0004;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;
 font-size:clamp(14px,4vw,21px);
 font-weight:900;line-height:1.12;
 position:relative;overflow:hidden;
}

.activated .green-curve{
 position:absolute;
 width:37px;height:65px;
 right:9px;top:-8px;
 border-right:9px solid #b9c849;
 border-top:9px solid #b9c849;
 border-radius:0 28px 0 0;
 transform:rotate(15deg);
 pointer-events:none;
}
.activated .green-arrow{
 position:absolute;
 right:0;top:-5px;
 font-size:34px;color:#b9c849;
 transform:rotate(-10deg);
}

.qr-box{
 width:23%;background:white;
 padding:5px;border-radius:8px;
 aspect-ratio:1;
}
.qr-box svg{width:100%;height:100%;display:block}

.terms{
 position:absolute;bottom:1.2%;
 width:100%;text-align:center;
 font-size:clamp(10px,3vw,14px);
 font-weight:700;color:#443322;
 text-decoration:underline;z-index:4;
}

.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;
 height:75px;background:#111b2c;
 border-top:1px solid #29354a;
 display:flex;justify-content:space-around;
 align-items:center;z-index:10;
 padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
 background:none;border:0;color:#8d9aaf;
 display:flex;flex-direction:column;
 align-items:center;gap:5px;
 font-size:12px;min-width:50px;
}
.nav-item .symbol{font-size:22px}
.nav-item.active{color:#edc46c;font-weight:800}

@media(max-width:360px){
 .header{height:72px}
 .actions button{padding:9px 11px}
 .pass-card{min-height:420px}
 .logo{width:45px;height:43px}
 .activated{min-height:62px}
}
@media(min-width:600px){
 .header,.bus-row,.card-wrap{
  max-width:500px;
  margin-left:auto;margin-right:auto;
 }
}
</style>
</head>

<body>

<header class="header">
 <h1>Passes</h1>
 <div class="actions">
  <button onclick="alert('Project demonstration')">☎ Help</button>
  <button onclick="alert('Pass history demonstration')">◷ History</button>
 </div>
</header>

<div class="bus-row">
 <span class="bus">▣ &nbsp; Bus (1/1)</span>
</div>

<main class="card-wrap">
<section class="pass-card">

 <div class="security-lines"></div>

 <div class="top-info">
  <div class="logo"><span>MTC</span></div>
  <div class="heading">
   <div class="pass-number">PASS NO: 00491763</div>
   <div class="tamil">
    விருப்பம் போல் பயணம்<br>
    செய்ய மாதச்சலுகை சீட்டு
   </div>
  </div>
  <div class="demo-tag">DEMO</div>
 </div>

 <div class="watermark">PROJECT DEMONSTRATION</div>

 <div class="approval">
  <span>✓</span>
  <small>DEMO</small>
 </div>

 <div class="portrait-panel">
  <img class="profile"
       src="./IMG_20261030_092647.jpg"
       alt="Project demo profile">
  <div class="amount">₹2000</div>
  <div class="valid-label">VALID FOR</div>
  <div class="valid-date">11/12/2026</div>
 </div>

 <div class="bottom-elements">

  <div class="clock-box">
   <div class="clock-date" id="smallDate"></div>
   <div class="clock-time" id="smallTime"></div>
  </div>

  <div class="activated">
   <span>Pass</span>
   <span>Activated!</span>
   <span class="green-curve"></span>
   <span class="green-arrow">↗</span>
  </div>

<div class="qr-box">
  <img
    src="https://raw.githubusercontent.com/Selvarajdharun/Chennai-One-Silver-Pass/496a43a987f917d0ad0ea9e8f66110d789ff0cf5/qr-empi.jpg"
    alt="Pass QR Code"
    style="width:100%;height:100%;object-fit:contain;display:block;"
  >
</div>

 </div>

 <div class="terms">Terms &amp; Conditions</div>

</section>
</main>


<nav class="bottom-nav">

  <button class="nav-item" onclick="nav('Home')">
    <span class="symbol">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <path d="M5 5h22v8H5zM5 17h22v7H5zM14 24h4v6h-4z" fill="#8994a8"/>
      </svg>
    </span>
    Home
  </button>

  <button class="nav-item active" onclick="nav('Passes')"
    style="color:#ffffff">
    <span class="symbol">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <rect x="1" y="1" width="30" height="30" rx="7" fill="#d92350"/>
        <path d="M5 17 C10 5 25 5 27 16 L27 27 L18 27 L18 20 L13 20 L13 27 L5 27Z"
          fill="#ffffff"/>
        <path d="M13 21 L18 16 L18 27 L13 27Z" fill="#d92350"/>
      </svg>
    </span>
    Passes
  </button>

  <button class="nav-item" onclick="nav('Live')">
    <span class="symbol">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <circle cx="16" cy="16" r="13" fill="#8994a8"/>
        <circle cx="16" cy="16" r="6" fill="#080e18"/>
      </svg>
    </span>
    Live
  </button>

  <button class="nav-item" onclick="nav('Ticket')">
    <span class="symbol">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <path d="M6 3 H26 V29 L16 23 L6 29Z" fill="#8994a8"/>
      </svg>
    </span>
    Ticket
  </button>

  <button class="nav-item" onclick="nav('Profile')">
    <span class="symbol">
      <svg viewBox="0 0 32 32" width="30" height="30">
        <circle cx="16" cy="9" r="6" fill="#8994a8"/>
        <path d="M4 29 C4 20 9 17 16 17 C23 17 28 20 28 29Z"
          fill="#8994a8"/>
      </svg>
    </span>
    Profile
  </button>

</nav>


<script>
function updateClock(){
 const d=new Date();

 document.getElementById("smallDate").textContent=
  d.toLocaleDateString("en-US",{
   month:"short",day:"2-digit"
  });

 document.getElementById("smallTime").textContent=
  d.toLocaleTimeString("en-GB",{hour12:false});
}

updateClock();
setInterval(updateClock,1000);

function nav(name){
 if(name!=="Passes"){
  alert(name+" - Project demonstration");
 }
}

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js")
   .catch(err=>console.log(err));
 });
}
</script>

</body>
</html>
