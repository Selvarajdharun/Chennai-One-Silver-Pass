<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Chennai One Silver Pass</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#080e18">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080b12;
  color:#f4f5f8;
  font-family:Arial, Helvetica, sans-serif;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:auto;
  padding:48px 22px 105px;
  background:
    radial-gradient(circle at 50% 0%, rgba(24,30,48,.35), transparent 35%),
    #080b12;
}

/* TOP BAR */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:42px;
}

.top h1{
  font-size:29px;
  letter-spacing:.3px;
  font-weight:700;
}

.top-actions{
  display:flex;
  gap:10px;
}

.top-btn{
  border:0;
  color:#e9ecf5;
  background:linear-gradient(145deg,#151b2b,#101521);
  padding:15px 19px;
  border-radius:30px;
  font-size:16px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}

.top-btn .icon{
  font-size:22px;
  line-height:1;
}

/* BUS TAB */
.bus-tab{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:14px 21px;
  background:#f1f2f7;
  color:#242a36;
  border-radius:30px;
  font-size:18px;
  margin-bottom:28px;
  box-shadow:0 4px 12px rgba(255,255,255,.08);
}

/* PASS */
.pass-wrap{
  width:100%;
}

.pass{
  position:relative;
  overflow:hidden;
  min-height:780px;
  border-radius:58px;
  padding:42px 22px 28px;
  color:#1d1b1b;

  background:
    radial-gradient(circle at 10% 80%, rgba(255,255,255,.18) 0 2px, transparent 3px),
    linear-gradient(120deg,
      #9b7442 0%,
      #c8a36d 16%,
      #b99055 42%,
      #e0c58e 72%,
      #9d7849 100%);

  border:3px solid rgba(255,255,255,.58);

  box-shadow:
    inset 0 0 70px rgba(255,255,255,.14),
    inset 0 0 80px rgba(84,53,20,.18),
    0 15px 35px rgba(0,0,0,.32);
}

/* subtle pass pattern */
.pass::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.17;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 42px,
      rgba(255,255,255,.25) 43px,
      transparent 44px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 48px,
      rgba(85,56,24,.2) 49px,
      transparent 50px
    );
}

.pass > *{
  position:relative;
  z-index:1;
}

/* HEADER */
.pass-header{
  display:flex;
  align-items:flex-start;
  gap:18px;
}

.mtc-logo{
  width:86px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
  color:#654620;
  border:6px solid rgba(101,70,32,.55);
  border-radius:50%;
  transform:scaleX(1.15);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.14);
}

.pass-title{
  flex:1;
  text-align:center;
  padding-top:3px;
}

.pass-no{
  font-family:"Courier New", monospace;
  font-size:22px;
  letter-spacing:1px;
  color:#443625;
  margin-bottom:4px;
}

.tamil{
  font-size:16px;
  line-height:1.45;
  font-weight:600;
  color:#4b3c2c;
}

/* APPROVAL STAMP */
.stamp{
  position:absolute;
  right:20px;
  top:190px;
  width:115px;
  height:115px;
  border:4px solid rgba(117,87,48,.22);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(-20deg);
  color:rgba(117,87,48,.3);
  font-size:54px;
  font-weight:bold;
}

.stamp::before{
  content:"DEMO APPROVED";
  position:absolute;
  font-size:10px;
  letter-spacing:3px;
  top:13px;
  transform:rotate(20deg);
}

/* PROFILE CARD */
.profile-card{
  width:245px;
  margin:85px auto 0;
  padding:38px 20px 34px;
  border-radius:48px;
  text-align:center;

  background:
    linear-gradient(145deg,#f9f9fb,#d9dce5);

  border:2px solid rgba(90,91,100,.22);

  box-shadow:
    0 8px 20px rgba(61,40,19,.16),
    inset 0 1px 3px rgba(255,255,255,.95);
}

.photo-frame{
  width:142px;
  height:142px;
  margin:0 auto 26px;
  border-radius:28px;
  overflow:hidden;
  background:#c5c7cc;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.photo-frame img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.amount{
  font-size:43px;
  font-weight:500;
  letter-spacing:-1px;
  color:#17223b;
  margin-bottom:43px;
}

.valid-label{
  font-size:14px;
  letter-spacing:5px;
  color:#5f6571;
  margin-bottom:20px;
}

.expiry{
  font-size:25px;
  font-weight:500;
  color:#1c2941;
}

/* BOTTOM ITEMS INSIDE PASS */
.pass-bottom{
  position:absolute;
  left:20px;
  right:20px;
  bottom:58px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}

.datetime{
  width:136px;
  padding:14px 10px;
  border-radius:17px;
  text-align:center;
  background:rgba(245,247,252,.88);
  border:1px solid rgba(90,90,90,.2);
  box-shadow:0 4px 10px rgba(60,40,20,.12);
  font-family:"Courier New", monospace;
}

#date{
  font-size:16px;
  color:#34405a;
  margin-bottom:5px;
}

#clock{
  font-size:20px;
  color:#1f2a3f;
}

.activated{
  width:178px;
  min-height:112px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border-radius:22px;
  transform:rotate(-5deg);

  background:
    radial-gradient(circle at 70% 40%, #a8b52c 0 15%, transparent 16%),
    linear-gradient(135deg,#1d75cc,#1859a8);

  color:#e9e5d4;
  font-size:28px;
  line-height:1.05;
  font-weight:800;

  border:5px solid rgba(242,244,244,.75);
  box-shadow:0 5px 12px rgba(0,0,0,.18);
}

.qr{
  width:92px;
  height:92px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  color:#222;

  background-color:#fff;
  background-image:
    linear-gradient(90deg,#111 10%,transparent 10%,transparent 30%,#111 30%,#111 40%,transparent 40%,transparent 60%,#111 60%,#111 70%,transparent 70%),
    linear-gradient(#111 10%,transparent 10%,transparent 30%,#111 30%,#111 40%,transparent 40%,transparent 60%,#111 60%,#111 70%,transparent 70%);
  background-size:18px 18px;
  border:7px solid #eee;
}

/* TERMS */
.terms{
  position:absolute;
  bottom:18px;
  left:0;
  width:100%;
  text-align:center;
  color:rgba(47,37,25,.82);
  font-size:17px;
  font-weight:700;
}

.demo{
  margin:16px auto 0;
  width:max-content;
  max-width:100%;
  padding:8px 14px;
  border:1px solid rgba(220,225,235,.18);
  border-radius:10px;
  color:#c9ced8;
  font-size:10px;
  letter-spacing:1px;
  text-align:center;
}

/* BOTTOM NAVIGATION */
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:10;
  max-width:480px;
  margin:auto;
  min-height:88px;
  padding:13px 10px 16px;

  display:flex;
  justify-content:space-around;

  background:#080b12;
  border-top:1px solid rgba(255,255,255,.035);
}

.nav div{
  width:20%;
  text-align:center;
  color:#a6adbc;
  font-size:14px;
  font-weight:600;
}

.nav b{
  display:block;
  height:30px;
  margin-bottom:4px;
  font-size:25px;
  font-weight:400;
  color:#aeb6c8;
}

.nav .active,
.nav .active b{
  color:#f1f3f8;
}

@media(max-width:390px){
  .app{
    padding-left:16px;
    padding-right:16px;
  }

  .top h1{
    font-size:26px;
  }

  .top-btn{
    padding:13px 14px;
  }

  .pass{
    min-height:730px;
    border-radius:48px;
  }

  .profile-card{
    width:220px;
    margin-top:75px;
  }

  .pass-bottom{
    transform:scale(.88);
    transform-origin:bottom center;
    left:0;
    right:0;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <h1>Passes</h1>

    <div class="top-actions">
      <button class="top-btn">
        <span class="icon">☎</span> Help
      </button>

      <button class="top-btn">
        <span class="icon">◷</span> History
      </button>
    </div>
  </div>

  <div class="bus-tab">
    <span>▣</span>
    <span>Bus (1/1)</span>
  </div>

  <div class="pass-wrap">

    <div class="pass">

      <div class="pass-header">
        <div class="mtc-logo">MTC</div>

        <div class="pass-title">
          <div class="pass-no">PASS NO. 00491763</div>
          <div class="tamil">
            விருப்பம் போல் பயணம்<br>
            செய்ய மாதச்சலுகை சீட்டு
          </div>
        </div>
      </div>

      <div class="stamp">✓</div>

      <div class="profile-card">

        <div class="photo-frame">
          <img src="IMG_20261030_092647.jpg" alt="Profile Photo">
        </div>

        <div class="amount">₹1000</div>

        <div class="valid-label">VALID FOR</div>

        <div class="expiry" id="expiry">--/--/----</div>

      </div>

      <div class="pass-bottom">

        <div class="datetime">
          <div id="date">---</div>
          <div id="clock">00:00:00</div>
        </div>

        <div class="activated">
          Pass<br>Activated!
        </div>

        <div class="qr">
          QR
        </div>

      </div>

      <div class="terms">Terms &amp; Conditions</div>

    </div>

    <div class="demo">
      NOT VALID FOR ACTUAL BUS TRAVEL
    </div>

  </div>

</div>

<div class="nav">
  <div><b>☰</b>Home</div>
  <div class="active"><b>▣</b>Passes</div>
  <div><b>●</b>Live</div>
  <div><b>▮</b>Ticket</div>
  <div><b>♟</b>Profile</div>
</div>

<script>
function updateTime(){

  const now = new Date();

  const time = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Kolkata",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(now);

  const date = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Kolkata",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(now);

  document.getElementById("clock").textContent = time;
  document.getElementById("date").textContent = date;
}

function updateExpiry(){

  const now = new Date();

  const expiry = new Date(now);
  expiry.setDate(expiry.getDate() + 30);

  const formatted = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Kolkata",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  }).format(expiry);

  document.getElementById("expiry").textContent = formatted;
}

updateTime();
updateExpiry();

setInterval(updateTime,1000);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("App Ready"))
      .catch(error => console.log(error));
  });
}
</script>

</body>
</html>
