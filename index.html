<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<title>Chennai One Silver Pass</title><style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080e18;
  color:#f4f5fa;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:25px 16px 105px;
}

/* TOP AREA */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:32px;
}

.title{
  font-size:28px;
  font-weight:700;
}

.top-actions{
  display:flex;
  gap:10px;
}

.action-btn{
  border:0;
  background:#111827;
  color:#eef1f7;
  border-radius:30px;
  padding:13px 17px;
  font-size:17px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px;
}

.bus-pill{
  display:inline-block;
  background:#eef0f6;
  color:#202938;
  border-radius:30px;
  padding:14px 22px;
  font-size:18px;
  margin:0 0 28px 18px;
}

/* GOLD PASS */
.pass{
  position:relative;
  width:100%;
  height:700px;
  overflow:hidden;
  border-radius:48px;
  padding:28px 22px;
  color:#4b3825;
  border:2px solid rgba(255,255,255,.55);
  background:
    radial-gradient(circle at 10% 8%,rgba(255,255,255,.30),transparent 25%),
    radial-gradient(circle at 88% 28%,rgba(255,255,255,.22),transparent 22%),
    linear-gradient(135deg,#b88b50,#e1c590 48%,#b88b50);
  box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.pass:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.12;
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:42px 42px;
}

.pass>*{
  position:relative;
  z-index:1;
}

/* PASS HEADER */
.pass-header{
  display:flex;
  align-items:flex-start;
}

.mtc-logo{
  width:80px;
  height:54px;
  border:5px solid rgba(101,70,35,.55);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:900;
  color:#68471f;
  margin-right:12px;
}

.pass-info{
  flex:1;
  text-align:center;
}

.pass-number{
  font-family:monospace;
  font-size:20px;
  letter-spacing:1px;
  margin-bottom:6px;
}

.tamil{
  font-size:16px;
  font-weight:700;
  line-height:1.35;
}

/* APPROVAL STAMP */
.seal{
  position:absolute;
  width:108px;
  height:108px;
  right:25px;
  top:135px;
  border:3px solid rgba(111,77,37,.25);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  color:rgba(105,72,34,.32);
  transform:rotate(-25deg);
}

/* PROFILE CARD */
.profile-card{
  width:235px;
  height:405px;
  margin:72px auto 0;
  padding:22px 18px;
  text-align:center;
  border-radius:42px;
  background:linear-gradient(145deg,#fff,#e8ebf3);
  box-shadow:0 10px 22px rgba(0,0,0,.18);
}

.profile-photo{
  width:135px;
  height:165px;
  object-fit:cover;
  border-radius:25px;
  display:block;
  margin:0 auto 18px;
  box-shadow:0 3px 9px rgba(0,0,0,.2);
}

.amount{
  font-size:43px;
  font-weight:500;
  color:#192844;
  margin-bottom:25px;
}

.valid-label{
  font-size:14px;
  letter-spacing:4px;
  color:#70798b;
  margin-bottom:12px;
}

.expiry{
  font-size:25px;
  color:#1b2a45;
  font-weight:500;
}

/* BOTTOM DETAILS */
.pass-bottom{
  position:absolute;
  left:20px;
  right:20px;
  bottom:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.datetime{
  width:110px;
  background:rgba(249,250,253,.92);
  border-radius:16px;
  padding:10px 5px;
  text-align:center;
  font-family:monospace;
  color:#202b3d;
}

#date{
  font-size:14px;
  margin-bottom:5px;
}

#clock{
  font-size:16px;
}

.activated{
  width:145px;
  height:72px;
  border-radius:17px;
  border:4px solid #e8ebef;
  background:linear-gradient(135deg,#2676d1,#1455a4);
  color:white;
  font-size:21px;
  font-weight:800;
  line-height:.9;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:left;
  transform:rotate(-5deg);
  box-shadow:0 5px 10px rgba(0,0,0,.2);
}

.activated:after{
  content:"✓";
  color:#c8d52d;
  font-size:47px;
  margin-left:5px;
}

.qr{
  width:60px;
  height:72px;
  border-radius:12px;
  background:
    repeating-linear-gradient(90deg,#111 0 3px,#fff 3px 7px),
    repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.5) 4px 8px);
  background-color:#fff;
  border:7px solid #f4f4f4;
}

.terms{
  position:absolute;
  bottom:13px;
  left:0;
  width:100%;
  text-align:center;
  color:#342a20;
  font-size:16px;
  font-weight:700;
}

.demo{
  text-align:center;
  color:#e4a1a1;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  margin-top:12px;
}

/* BOTTOM NAVIGATION */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:88px;
  background:#080e18;
  border-top:1px solid #151d2b;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:8px;
  z-index:10;
}

.nav div{
  flex:1;
  text-align:center;
  color:#9099ac;
  font-size:13px;
  font-weight:700;
}

.nav b{
  display:block;
  height:34px;
  font-size:26px;
  line-height:28px;
  font-weight:500;
}

.nav .active{
  color:#fff;
}

.nav .active b{
  color:#e94159;
}

@media(max-width:380px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .title{
    font-size:25px;
  }

  .action-btn{
    padding:11px 12px;
    font-size:15px;
  }

  .pass{
    height:675px;
    padding-left:16px;
    padding-right:16px;
  }

  .profile-card{
    margin-top:65px;
    width:225px;
    height:390px;
  }

  .pass-bottom{
    left:14px;
    right:14px;
  }

  .datetime{
    width:96px;
  }

  .activated{
    width:135px;
    font-size:19px;
  }

  .qr{
    width:55px;
  }
}
</style></head><body><div class="app">  <div class="topbar">
    <div class="title">Passes</div><div class="top-actions">
  <button class="action-btn">☎ &nbsp;Help</button>
  <button class="action-btn">◷ &nbsp;History</button>
</div>

  </div>  <div class="bus-pill">▣ &nbsp;Bus (1/1)</div>  <div class="pass"><div class="pass-header">
  <div class="mtc-logo">MTC</div>

  <div class="pass-info">
    <div class="pass-number">PASS NO. 00491763</div>
    <div class="tamil">
      விருப்பம் போல் பயணம்<br>
      செய்ய மாதச்சலுகை சீட்டு
    </div>
  </div>
</div>

<div class="seal">✓</div>

<div class="profile-card">
  <img src="IMG_20261030_092647.jpg"
       alt="Profile Photo"
       class="profile-photo">

  <div class="amount">₹1000</div>

  <div class="valid-label">VALID FOR</div>

  <div class="expiry" id="expiry">07/11/2026</div>
</div>

<div class="pass-bottom">

  <div class="datetime">
    <div id="date">--</div>
    <div id="clock">00:00:00</div>
  </div>

  <div class="activated">
    Pass<br>Activated!
  </div>

  <div class="qr"></div>

</div>

<div class="terms">Terms &amp; Conditions</div>

  </div>  <div class="demo">NOT VALID FOR ACTUAL BUS TRAVEL</div></div><div class="nav">
  <div><b>☰</b>Home</div>
  <div class="active"><b>▣</b>Passes</div>
  <div><b>●</b>Live</div>
  <div><b>▮</b>Ticket</div>
  <div><b>♟</b>Profile</div>
</div><script>
function updateTime(){
  const now = new Date();

  const time = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Kolkata",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(now);

  const date = new Intl.DateTimeFormat("en-GB",{
    timeZone:"Asia/Kolkata",
    day:"2-digit",
    month:"short",
    year:"numeric"
  }).format(now);

  document.getElementById("clock").textContent=time;
  document.getElementById("date").textContent=date;
}

function updateExpiry(){
  const now = new Date();

  const parts = new Intl.DateTimeFormat("en-US",{
    timeZone:"Asia/Kolkata",
    year:"numeric",
    month:"numeric",
    day:"numeric"
  }).formatToParts(now);

  const get = type =>
    Number(parts.find(p=>p.type===type).value);

  const expiry = new Date(Date.UTC(
    get("year"),
    get("month")-1,
    get("day")+30
  ));

  const formatted = new Intl.DateTimeFormat("en-GB",{
    timeZone:"UTC",
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  }).format(expiry);

  document.getElementById("expiry").textContent=formatted;
}

updateTime();
updateExpiry();
setInterval(updateTime,1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("App Ready"))
      .catch(error => console.log(error));
  });
}
</script></body>
</html>
