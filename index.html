
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chennai One Silver Pass</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080e18;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:90px;
}

.header{
  height:82px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header h1{font-size:23px}

.actions{display:flex;gap:9px}

.actions button{
  border:0;border-radius:30px;
  padding:11px 15px;
  background:#111b2b;color:white;
  font-size:13px;
}

.bus-row{padding:5px 5% 18px}

.bus{
  display:inline-block;
  background:#f1f1f8;color:#192236;
  padding:11px 17px;border-radius:30px;
  font-size:13px;
}

.card-wrap{padding:0 4.5%}

.pass-card{
  width:100%;
  aspect-ratio:.685;
  min-height:430px;
  position:relative;
  overflow:hidden;
  border-radius:29px;
  border:3px solid #b89555;
  color:#44321c;
  background:
    radial-gradient(ellipse at 75% 30%,#f9edcf 0%,transparent 42%),
    radial-gradient(ellipse at 15% 80%,#c9a66d 0%,transparent 45%),
    repeating-linear-gradient(45deg,
      rgba(255,255,255,.13) 0px,
      rgba(255,255,255,.13) 1px,
      transparent 1px,
      transparent 9px),
    linear-gradient(125deg,#c9a66f,#f1dfb9 45%,#d2b47c);
  box-shadow:0 5px 15px #0005;
}

.pass-card:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 82% 30%,
      transparent 0 15%,rgba(128,91,43,.16) 15.2% 15.5%,
      transparent 15.8%),
    radial-gradient(circle at 15% 65%,
      transparent 0 12%,rgba(128,91,43,.14) 12.2% 12.5%,
      transparent 12.8%),
    repeating-radial-gradient(circle at 50% 50%,
      transparent 0 34px,rgba(120,85,40,.045) 35px 36px);
  pointer-events:none;
}

.watermark{
  position:absolute;
  top:48%;left:50%;
  transform:translate(-50%,-50%) rotate(-35deg);
  font-size:clamp(13px,4vw,18px);
  font-weight:bold;
  letter-spacing:3px;
  white-space:nowrap;
  color:#805c2a18;
  z-index:1;
}

.top-info{
  position:absolute;
  top:4%;left:5%;right:5%;
  display:flex;align-items:flex-start;
  gap:10px;z-index:2;
}

.logo{
  width:49px;height:49px;
  flex-shrink:0;
  border:3px double #896333;
  border-radius:50%;
  display:flex;align-items:center;
  justify-content:center;
  font-size:12px;font-weight:900;
  color:#78552c;
  position:relative;
}

.logo:before,.logo:after{
  content:"";
  position:absolute;
  width:13px;height:17px;
  background:#896333;
  top:13px;
  z-index:-1;
}
.logo:before{left:-8px}
.logo:after{right:-8px}

.heading{flex:1;min-width:0;padding-top:4px}

.pass-number{
  font-family:monospace;
  font-size:clamp(12px,3.5vw,17px);
  letter-spacing:1px;
  white-space:nowrap;
  color:#44321e;
}

.tamil{
  font-size:clamp(10px,3vw,14px);
  text-align:center;
  line-height:1.5;
  margin-top:5px;
  color:#62503a;
}

.demo-tag{
  position:absolute;right:0;top:0;
  font-size:9px;font-weight:bold;
  color:#79552d;
}

.approval{
  position:absolute;
  width:23%;aspect-ratio:1;
  top:25%;right:5%;
  border-radius:50%;
  border:3px double rgba(134,99,55,.48);
  display:flex;align-items:center;
  justify-content:center;
  color:rgba(112,81,42,.68);
  z-index:2;
  transform:rotate(14deg);
}

.approval span{font-size:35px}
.approval small{
  position:absolute;bottom:8%;
  font-size:7px;letter-spacing:2px;
}

.portrait-panel{
  position:absolute;
  top:22%;left:50%;
  transform:translateX(-50%);
  width:44%;height:51%;
  border-radius:29px;
  background:#f8f8fb;
  border:3px solid #e4dfd5;
  box-shadow:0 3px 10px #7a603322;
  display:flex;flex-direction:column;
  align-items:center;
  padding:8% 5% 5%;
  z-index:3;
}

.profile{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  object-position:center;
  border-radius:21px;
  border:1px solid #ddd;
}

.amount{
  color:#202c43;
  font-size:clamp(25px,7vw,36px);
  font-weight:500;
  margin-top:12%;
  white-space:nowrap;
}

.valid-label{
  color:#8792a3;
  font-size:clamp(9px,2.8vw,13px);
  letter-spacing:3px;
  margin-top:13%;
}

.valid-date{
  color:#27344b;
  font-size:clamp(16px,4.8vw,23px);
  margin-top:8%;
  white-space:nowrap;
}

.bottom-elements{
  position:absolute;
  left:4%;right:4%;
  bottom:6%;height:15%;
  display:flex;align-items:center;
  justify-content:space-between;
  gap:5px;z-index:3;
}

.clock-box{
  background:#f1f0f8;
  color:#26334b;
  border-radius:12px;
  width:27%;padding:10px 3px;
  text-align:center;
}

.clock-date{
  font-family:monospace;
  font-size:clamp(9px,2.8vw,13px);
}

.clock-time{
  font-family:monospace;
  font-size:clamp(10px,3vw,15px);
  margin-top:5px;
}

.activated{
  background:#0877df;
  color:white;
  width:46%;min-height:75px;
  padding:8px 4px;
  border:4px solid #f8f5e9;
  border-radius:18px;
  transform:rotate(-5deg);
  box-shadow:0 3px 6px #0004;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  font-size:clamp(14px,4vw,21px);
  font-weight:900;line-height:1.12;
  position:relative;
}

.activated .arrow{
  position:absolute;
  right:2px;top:-4px;
  font-size:43px;
  color:#bdc948;
  transform:rotate(-8deg);
}

.qr-box{
  width:23%;
  background:white;
  padding:5px;border-radius:8px;
  aspect-ratio:1;
}

.qr-box svg{width:100%;height:100%;display:block}

.terms{
  position:absolute;
  bottom:1.2%;
  width:100%;
  text-align:center;
  font-size:clamp(10px,3vw,14px);
  font-weight:700;
  color:#443322;
  text-decoration:underline;
  z-index:4;
}

.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:75px;
  background:#111b2c;
  border-top:1px solid #29354a;
  display:flex;justify-content:space-around;
  align-items:center;
  z-index:10;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
  background:none;border:0;
  color:#8d9aaf;
  display:flex;flex-direction:column;
  align-items:center;gap:5px;
  font-size:12px;min-width:50px;
}

.nav-item .symbol{font-size:22px}

.nav-item.active{
  color:#edc46c;font-weight:800;
}

@media(max-width:360px){
  .header{height:72px}
  .actions button{padding:9px 11px}
  .pass-card{min-height:420px}
  .logo{width:43px;height:43px}
  .activated{min-height:62px}
}

@media(min-width:600px){
  .header,.bus-row,.card-wrap{
    max-width:500px;
    margin-left:auto;margin-right:auto;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>Passes</h1>
  <div class="actions">
    <button onclick="alert('Project demonstration')">☎ Help</button>
    <button onclick="alert('Pass history demonstration')">◷ History</button>
  </div>
</header>

<div class="bus-row">
  <span class="bus">▣ &nbsp; Bus (1/1)</span>
</div>

<main class="card-wrap">
<section class="pass-card">

  <div class="top-info">
    <div class="logo">MTC</div>
    <div class="heading">
      <div class="pass-number">PASS NO: 00491763</div>
      <div class="tamil">
        விருப்பம் போல் பயணம்<br>
        செய்ய மாதச்சலுகை சீட்டு
      </div>
    </div>
    <div class="demo-tag">DEMO</div>
  </div>

  <div class="watermark">PROJECT DEMONSTRATION</div>

  <div class="approval">
    <span>✓</span>
    <small>DEMO</small>
  </div>

  <div class="portrait-panel">
    <img
      class="profile"
      src="./IMG_20261030_092647.jpg"
      alt="Project demo profile"
    >
    <div class="amount">₹2000</div>
    <div class="valid-label">VALID FOR</div>
    <div class="valid-date">11/12/2026</div>
  </div>

  <div class="bottom-elements">

    <div class="clock-box">
      <div class="clock-date" id="smallDate"></div>
      <div class="clock-time" id="smallTime"></div>
    </div>

    <div class="activated">
      <span>Pass</span>
      <span>Activated!</span>
      <span class="arrow">↗</span>
    </div>

    <div class="qr-box">
      <svg viewBox="0 0 21 21"
           xmlns="http://www.w3.org/2000/svg">
        <rect width="21" height="21" fill="#fff"/>
        <g fill="#111">
          <path d="M1 1h7v7H1zM2 2v5h5V2zM3 3h3v3H3z"/>
          <path d="M13 1h7v7h-7zM14 2v5h5V2zM15 3h3v3h-3z"/>
          <path d="M1 13h7v7H1zM2 14v5h5v-5zM3 15h3v3H3z"/>
          <path d="M9 1h2v2H9zM11 4h2v2h-2zM9 7h2v2H9z"/>
          <path d="M10 10h3v3h-3zM14 10h2v2h-2zM18 10h2v2h-2z"/>
          <path d="M9 14h2v2H9zM12 15h2v2h-2zM15 13h2v2h-2z"/>
          <path d="M18 15h2v2h-2zM10 18h2v2h-2zM14 18h2v2h-2z"/>
        </g>
      </svg>
    </div>

  </div>

  <div class="terms">Terms &amp; Conditions</div>

</section>
</main>

<nav class="bottom-nav">
  <button class="nav-item" onclick="nav('Home')">
    <span class="symbol">⚑</span>Home
  </button>
  <button class="nav-item active" onclick="nav('Passes')">
    <span class="symbol">▣</span>Passes
  </button>
  <button class="nav-item" onclick="nav('Live')">
    <span class="symbol">●</span>Live
  </button>
  <button class="nav-item" onclick="nav('Ticket')">
    <span class="symbol">▮</span>Ticket
  </button>
  <button class="nav-item" onclick="nav('Profile')">
    <span class="symbol">♟</span>Profile
  </button>
</nav>

<script>
function updateClock(){
  const d=new Date();

  document.getElementById("smallDate").textContent=
    d.toLocaleDateString("en-US",{
      month:"short",
      day:"2-digit"
    });

  document.getElementById("smallTime").textContent=
    d.toLocaleTimeString("en-GB",{
      hour12:false
    });
}

updateClock();
setInterval(updateClock,1000);

function nav(name){
  if(name!=="Passes"){
    alert(name+" - Project demonstration");
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(err=>console.log(err));
  });
}
</script>

</body>
</html>
