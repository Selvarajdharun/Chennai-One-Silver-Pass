
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chennai One Silver Pass</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080e18;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:83px;
}

.header{
  height:83px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header h1{font-size:23px;font-weight:700}

.actions{display:flex;gap:9px}

.actions button{
  border:0;
  border-radius:30px;
  padding:11px 16px;
  background:#111b2b;
  color:#e5eaf2;
  font-size:13px;
}

.bus-row{padding:4px 5% 18px}

.bus{
  background:#f1f1f8;
  color:#192236;
  display:inline-block;
  padding:11px 17px;
  border-radius:30px;
  font-size:13px;
}

.card-wrap{padding:0 4.5%}

.pass-card{
  width:100%;
  aspect-ratio:0.685;
  min-height:440px;
  position:relative;
  overflow:hidden;
  border-radius:29px;
  border:2px solid #e2d1b0;
  color:#252b35;
  background:
    radial-gradient(ellipse at 80% 30%,rgba(255,255,255,.32),transparent 32%),
    radial-gradient(ellipse at 15% 75%,rgba(120,79,25,.20),transparent 38%),
    repeating-linear-gradient(125deg,rgba(255,255,255,.08) 0px,rgba(255,255,255,.08) 2px,transparent 2px,transparent 9px),
    linear-gradient(135deg,#d8bc8a,#f1dfbd 42%,#d6b77e 75%,#ead4a6);
  box-shadow:0 4px 15px #0006;
}

.pass-card:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.35;
  background:
   repeating-radial-gradient(circle at 85% 30%,transparent 0 17px,rgba(125,86,39,.18) 18px 19px,transparent 20px 35px);
  pointer-events:none;
}

.pass-card:after{
  content:"PROJECT DEMONSTRATION";
  position:absolute;
  top:47%;
  left:50%;
  transform:translate(-50%,-50%) rotate(-36deg);
  font-size:clamp(13px,4vw,22px);
  font-weight:900;
  letter-spacing:3px;
  color:rgba(92,59,23,.09);
  white-space:nowrap;
  pointer-events:none;
}

.top-info{
  position:absolute;
  top:4%;
  left:5%;
  right:5%;
  height:17%;
  display:flex;
  align-items:flex-start;
  gap:8px;
  z-index:1;
}

.logo{
  width:52px;
  height:52px;
  flex-shrink:0;
  border:3px double #8d6535;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
  color:#78552c;
  margin-top:3px;
}

.heading{
  flex:1;
  min-width:0;
  padding-top:5px;
}

.pass-number-label{
  font-family:monospace;
  font-size:clamp(12px,3.7vw,17px);
  letter-spacing:1px;
  white-space:nowrap;
}

.tamil{
  font-size:clamp(10px,3vw,14px);
  text-align:center;
  line-height:1.45;
  margin-top:4px;
  color:#62503a;
}

.demo-tag{
  position:absolute;
  top:0;
  right:0;
  font-size:8px;
  font-weight:bold;
  letter-spacing:.5px;
  color:#75502a;
}

.approval{
  position:absolute;
  width:24%;
  aspect-ratio:1;
  top:25%;
  right:5%;
  border-radius:50%;
  border:3px double rgba(134,99,55,.48);
  display:flex;
  justify-content:center;
  align-items:center;
  color:rgba(112,81,42,.65);
  z-index:1;
  transform:rotate(15deg);
}

.approval span{
  font-size:clamp(27px,8vw,40px);
}

.approval small{
  position:absolute;
  bottom:9%;
  font-size:7px;
  letter-spacing:2px;
}

.portrait-panel{
  position:absolute;
  top:22%;
  left:50%;
  transform:translateX(-50%);
  width:39%;
  height:51%;
  border-radius:27px;
  background:#f8f8fb;
  border:2px solid #d9d6d0;
  box-shadow:0 3px 10px #7a603333;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8% 5% 5%;
  z-index:2;
}

.profile{
  width:100%;
  aspect-ratio:1;
  border-radius:22px;
  object-fit:cover;
  object-position:center;
  border:1px solid #ddd;
}

.amount{
  color:#202c43;
  font-size:clamp(25px,7vw,36px);
  font-weight:500;
  margin-top:12%;
  white-space:nowrap;
}

.valid-label{
  color:#8792a3;
  font-size:clamp(9px,2.8vw,13px);
  letter-spacing:3px;
  margin-top:13%;
}

.valid-date{
  color:#27344b;
  font-size:clamp(17px,5vw,24px);
  margin-top:8%;
  white-space:nowrap;
}

.bottom-elements{
  position:absolute;
  left:4%;
  right:4%;
  bottom:5%;
  height:16%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  z-index:3;
}

.clock-box{
  background:#f1f0f8;
  color:#26334b;
  border-radius:12px;
  width:28%;
  padding:9px 3px;
  text-align:center;
  box-shadow:0 2px 5px #735e4033;
}

.clock-date{
  font-family:monospace;
  font-size:clamp(9px,2.8vw,13px);
}

.clock-time{
  font-family:monospace;
  font-size:clamp(11px,3.2vw,16px);
  margin-top:5px;
}

.activated{
  background:#1475dc;
  color:#fff;
  width:45%;
  min-height:78px;
  padding:9px 5px;
  border:4px solid #f7f4e9;
  border-radius:17px;
  transform:rotate(-5deg);
  box-shadow:0 3px 5px #0003;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:clamp(14px,4vw,21px);
  font-weight:900;
  line-height:1.1;
}

.activated .arrow{
  position:absolute;
  right:2px;
  top:-3px;
  font-size:48px;
  color:#b7c64c;
  opacity:.95;
  transform:rotate(-8deg);
}

.qr-box{
  width:23%;
  background:#fff;
  padding:5px;
  border-radius:8px;
  aspect-ratio:1;
}

.qr-box svg{width:100%;height:100%;display:block}

.terms{
  position:absolute;
  bottom:1%;
  width:100%;
  text-align:center;
  font-size:clamp(10px,3vw,14px);
  font-weight:700;
  color:#443322;
  text-decoration:underline;
  z-index:4;
}

.clock-outside{
  text-align:center;
  padding:17px 5px 23px;
  color:#aab5c7;
}

.clock-outside .date{font-size:14px}

.clock-outside .time{
  color:#fff;
  font-size:29px;
  font-weight:800;
  margin-top:7px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:#111b2c;
  border-top:1px solid #29354a;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
  background:none;
  border:0;
  color:#8d9aaf;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  font-size:12px;
  min-width:50px;
}

.nav-item .symbol{font-size:22px}

.nav-item.active{
  color:#edc46c;
  font-weight:800;
}

@media(max-width:360px){
  .header{height:72px}
  .actions button{padding:9px 11px}
  .pass-card{min-height:420px}
  .logo{width:43px;height:43px}
  .activated{min-height:65px}
}

@media(min-width:600px){
  .header,.bus-row,.card-wrap,.clock-outside{
    max-width:500px;
    margin-left:auto;
    margin-right:auto;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>Passes</h1>
  <div class="actions">
    <button onclick="alert('Project demonstration')">☎ Help</button>
    <button onclick="alert('Pass history demonstration')">◷ History</button>
  </div>
</header>

<div class="bus-row">
  <span class="bus">▣ &nbsp; Bus (1/1)</span>
</div>

<main class="card-wrap">
<section class="pass-card">

  <div class="top-info">
    <div class="logo">MTC</div>
    <div class="heading">
      <div class="pass-number-label">PASS NO: 00491763</div>
      <div class="tamil">
        விருப்பம் போல் பயணம்<br>
        செய்ய மாதச்சலுகை சீட்டு
      </div>
    </div>
    <div class="demo-tag">DEMO</div>
  </div>

  <div class="approval">
    <span>✓</span>
    <small>DEMO</small>
  </div>

  <div class="portrait-panel">
    <img
      class="profile"
      src="./IMG_20261030_092647.jpg"
      alt="Profile photo"
    >

    <div class="amount">₹2000</div>

    <div class="valid-label">VALID FOR</div>

    <div class="valid-date">11/12/2026</div>
  </div>

  <div class="bottom-elements">

    <div class="clock-box">
      <div class="clock-date" id="smallDate">Nov 11</div>
      <div class="clock-time" id="smallTime">06:45:52</div>
    </div>

    <div class="activated">
      <span>Pass</span>
      <span>Activated!</span>
      <span class="arrow">↗</span>
    </div>

    <div class="qr-box">
      <!-- Decorative, non-scannable QR-style artwork -->
      <svg viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect width="21" height="21" fill="#fff"/>
        <g fill="#111">
          <path d="M1 1h7v7H1zM2 2v5h5V2zM3 3h3v3H3z"/>
          <path d="M13 1h7v7h-7zM14 2v5h5V2zM15 3h3v3h-3z"/>
          <path d="M1 13h7v7H1zM2 14v5h5v-5zM3 15h3v3H3z"/>
          <path d="M9 1h2v2H9zM11 4h2v2h-2zM9 7h2v2H9z"/>
          <path d="M10 10h3v3h-3zM14 10h2v2h-2zM18 10h2v2h-2z"/>
          <path d="M9 14h2v2H9zM12 15h2v2h-2zM15 13h2v2h-2z"/>
          <path d="M18 15h2v2h-2zM10 18h2v2h-2zM14 18h2v2h-2z"/>
        </g>
      </svg>
    </div>

  </div>

  <div class="terms">Terms &amp; Conditions</div>

</section>
</main>

<section class="clock-outside">
  <div class="date" id="fullDate"></div>
  <div class="time" id="fullTime"></div>
</section>

<nav class="bottom-nav">
  <button class="nav-item" onclick="nav('Home')">
    <span class="symbol">⚑</span>
    Home
  </button>
  <button class="nav-item active" onclick="nav('Passes')">
    <span class="symbol">▣</span>
    Passes
  </button>
  <button class="nav-item" onclick="nav('Live')">
    <span class="symbol">●</span>
    Live
  </button>
  <button class="nav-item" onclick="nav('Ticket')">
    <span class="symbol">▮</span>
    Ticket
  </button>
  <button class="nav-item" onclick="nav('Profile')">
    <span class="symbol">♟</span>
    Profile
  </button>
</nav>

<script>
function updateClock(){
  const d=new Date();

  document.getElementById("smallDate").textContent=
    d.toLocaleDateString("en-US",{month:"short",day:"2-digit"});

  document.getElementById("smallTime").textContent=
    d.toLocaleTimeString("en-GB",{hour12:false});

  document.getElementById("fullDate").textContent=
    d.toLocaleDateString("en-GB",{
      weekday:"long",
      day:"2-digit",
      month:"long",
      year:"numeric"
    });

  document.getElementById("fullTime").textContent=
    d.toLocaleTimeString("en-US",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    });
}

updateClock();
setInterval(updateClock,1000);

function nav(name){
  if(name!=="Passes"){
    alert(name+" - Project demonstration");
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(err=>console.log(err));
  });
}
</script>

</body>
</html>
